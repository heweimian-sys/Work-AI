<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>项目库采集器</title><style>body{width:340px;font:14px -apple-system,BlinkMacSystemFont,sans-serif;padding:14px;color:#222}button{width:100%;padding:10px;margin:6px 0;border:0;border-radius:8px;background:#111;color:white;cursor:pointer}button.secondary{background:#fff;color:#111;border:1px solid #bbb}button:disabled{opacity:.5;cursor:wait}#status{margin-top:10px;padding:10px;border-radius:8px;background:#f5f5f5;color:#555;line-height:1.5;white-space:pre-line}.ok{color:#16803c;background:#effaf2!important}.err{color:#b42318;background:#fff1f0!important}.summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.stat{padding:8px;background:#f7f7f7;border-radius:6px;font-size:12px}.stat strong{display:block;font-size:18px}.section{margin-top:14px;padding:9px 10px;background:#f1f5ff;border-radius:8px;line-height:1.4}.section strong{display:block}.section small{display:block;color:#667085;margin-top:3px}</style></head>
<body>
  <h3>项目库采集器</h3>
  <div class="summary">
    <div class="stat">本地记录<strong id="recordCount">0</strong></div>
    <div class="stat">待同步<strong id="unsentCount">0</strong></div>
    <div class="stat">监控账号<strong id="accountCount">0</strong></div>
    <div class="stat">接口响应<strong id="responseCount">0</strong></div>
  </div>
  <div class="section"><strong>第一步：找到值得看的内容</strong><small>先从关键词、热门内容或指定账号开始，不会自动把随机内容全部写入飞书。</small></div>
  <label>搜索词</label>
  <input id="keyword" placeholder="例如：AI获客、低成本创业" style="width:96%;padding:8px;margin:4px 0 8px">
  <label>最低互动数（点赞/播放/阅读）</label>
  <input id="threshold" type="number" min="0" value="0" style="width:96%;padding:8px;margin:4px 0 8px">
  <button id="collect">采集当前页面</button>
  <button id="collectKeyword">按搜索词批量采集</button>
  <button id="collectHot">只采集高互动内容</button>
  <button id="watchAccount">保存这个账号，后续跟踪</button>
  <div class="section"><strong>第二步：补全和筛选</strong><small>从本地记录中找出高潜内容，再打开单篇页面补正文和评论。</small></div>
  <button id="detail">补全当前内容的正文和评论</button>
  <button id="cards">筛选高潜内容（生成待审核卡）</button>
  <div class="section"><strong>第三步：确认后入库</strong><small>飞书只保存你确认过的素材，原始记录仍保留用于追溯。</small></div>
  <button id="sendFeishu">把已采集内容同步到飞书</button>
  <button id="openFeishu" class="secondary">打开飞书项目库收件箱</button>
  <button id="download">导出本地收件箱</button>
  <div id="status">先打开小红书、B站、X 或 YouTube 的列表页，再选择上面的采集方式。</div>
  <script src="popup.js"></script>
</body>
</html>
