<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>项目库采集器</title><style>body{width:340px;font:14px -apple-system,BlinkMacSystemFont,sans-serif;padding:14px;color:#222}button{width:100%;padding:10px;margin:6px 0;border:0;border-radius:8px;background:#111;color:white;cursor:pointer}button.secondary{background:#fff;color:#111;border:1px solid #bbb}button:disabled{opacity:.5;cursor:wait}#status{margin-top:10px;padding:10px;border-radius:8px;background:#f5f5f5;color:#555;line-height:1.5;white-space:pre-line}.ok{color:#16803c;background:#effaf2!important}.err{color:#b42318;background:#fff1f0!important}.summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.stat{padding:8px;background:#f7f7f7;border-radius:6px;font-size:12px}.stat strong{display:block;font-size:18px}</style></head>
<body>
  <h3>项目库采集器</h3>
  <div class="summary">
    <div class="stat">本地记录<strong id="recordCount">0</strong></div>
    <div class="stat">待同步<strong id="unsentCount">0</strong></div>
    <div class="stat">监控账号<strong id="accountCount">0</strong></div>
    <div class="stat">接口响应<strong id="responseCount">0</strong></div>
  </div>
  <label>关键词（可选）</label>
  <input id="keyword" placeholder="例如：AI获客、低成本创业" style="width:96%;padding:8px;margin:4px 0 8px">
  <label>爆款门槛（可选，点赞/播放/阅读）</label>
  <input id="threshold" type="number" min="0" value="0" style="width:96%;padding:8px;margin:4px 0 8px">
  <button id="collect">采集当前页面</button>
  <button id="collectKeyword">关键词采集</button>
  <button id="collectHot">采集爆款内容</button>
  <button id="watchAccount">加入对标账号</button>
  <button id="detail">采集详情和评论</button>
  <button id="cards">生成待审核项目卡</button>
  <button id="sendFeishu">采集内容写入飞书</button>
  <button id="openFeishu" class="secondary">打开飞书项目库收件箱</button>
  <button id="download">导出本地收件箱</button>
  <div id="status">打开小红书、B站、X 或 YouTube 页面后点击采集。</div>
  <script src="popup.js"></script>
</body>
</html>
